name: Update GitHub Status JSON

# Déclenché principalement par cron-job.org via workflow_dispatch (comme tes autres plugins),
# + un schedule GitHub natif en secours toutes les 15 min (peu fiable seul, mais ne coûte rien en filet de sécurité).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch GitHub Status
        run: node scripts/fetch-github-status.mjs

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/status.json
          git diff --staged --quiet || git commit -m "chore: update GitHub status JSON"
          git push
